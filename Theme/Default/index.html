<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>TeleCode Executor</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #121212;
            --accent: #3b82f6;
            --text: #e5e5e5;
            --text-dim: #a3a3a3;
            --code: #10b981;
        }

        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 580px;
            height: 380px;
            background: var(--bg);
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .header {
            padding: 12px 20px;
            background: var(--surface);
            display: flex;
            justify-content: space-between;
            align-items: center;
            -webkit-app-region: drag;
            /* Draggable area */
            border-bottom: 1px solid #222;
        }

        .title {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.05em;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .controls {
            display: flex;
            gap: 8px;
            -webkit-app-region: no-drag;
        }

        .btn-circle {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-close {
            background: #ef4444;
        }

        .btn-hide {
            background: #f59e0b;
        }

        .editor-container {
            flex: 1;
            padding: 12px;
            background: #000;
        }

        textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            color: var(--code);
            /* Dynamic code color */
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 14px;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        .footer {
            padding: 12px 20px;
            background: var(--surface);
            display: flex;
            justify-content: flex-end;
            align-items: center;
            border-top: 1px solid #222;
        }

        .run-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
        }

        .run-btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .run-btn:active {
            transform: translateY(0);
        }

        /* Custom scrollbar */
        textarea::-webkit-scrollbar {
            width: 4px;
        }

        textarea::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="title">TeleCode Executor</div>
            <div class="controls">
                <div class="btn-circle btn-hide" onclick="window.minimize()"></div>
                <div class="btn-circle btn-close" onclick="window.closeWindow()"></div>
            </div>
        </div>
        <div class="editor-container">
            <textarea id="script-input" placeholder="-- Enter your script here..."></textarea>
        </div>
        <div class="footer">
            <button class="run-btn" onclick="executeScript()">RUN</button>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        window.closeWindow = () => {
            ipcRenderer.send('window-hide');
        };

        window.minimize = () => {
            ipcRenderer.send('window-minimize');
        };

        ipcRenderer.on('apply-theme', (event, theme) => {
            document.documentElement.style.setProperty('--bg', theme.bg);
            document.documentElement.style.setProperty('--surface', theme.surface);
            document.documentElement.style.setProperty('--accent', theme.accent);
            document.documentElement.style.setProperty('--text', theme.text);
            document.documentElement.style.setProperty('--text-dim', theme.textDim);
            document.documentElement.style.setProperty('--code', theme.code);

            const container = document.querySelector('.container');
            container.style.borderColor = theme.accent + '44';
        });

        async function executeScript() {
            const script = document.getElementById('script-input').value;
            if (!script) return;

            try {
                const response = await fetch('http://localhost:3000/execute', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ script })
                });

                if (response.ok) {
                    const btn = document.querySelector('.run-btn');
                    const originalText = btn.innerText;
                    btn.innerText = 'EXECUTED';
                    btn.style.background = 'var(--code)';
                    btn.style.boxShadow = `0 4px 6px -1px var(--code)`;

                    setTimeout(() => {
                        btn.innerText = originalText;
                        btn.style.background = '';
                        btn.style.boxShadow = '';
                    }, 2000);
                }
            } catch (error) {
                console.error('Error executing script:', error);
            }
        }
    </script>
</body>

</html>

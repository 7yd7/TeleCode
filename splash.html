<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>TeleCode Loader</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0e0e12;
            color: #e8e8ec;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at top, #1a1a24 0%, #0e0e12 60%);
        }

        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.4));
            animation: pulse 3s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.4));
            }

            50% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 30px rgba(99, 102, 241, 0.6));
            }
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        p {
            color: #5a5a66;
            font-size: 13px;
            margin-bottom: 25px;
            /* Reduced from 40px to move button up */
        }

        .progress-container {
            width: 100%;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .progress-bar-bg {
            width: 100%;
            height: 4px;
            background: #1a1a24;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-bar {
            height: 100%;
            width: 30%;
            background: #6366f1;
            border-radius: 2px;
            animation: indeterminate 1.5s infinite ease-in-out;
        }

        @keyframes indeterminate {
            0% {
                transform: translateX(-100%);
                width: 30%;
            }

            50% {
                width: 50%;
            }

            100% {
                transform: translateX(300%);
                width: 30%;
            }
        }

        .status-text {
            color: #5a5a66;
            font-size: 11px;
            margin-top: 8px;
        }

        @keyframes revealPrompt {
            0% {
                opacity: 0;
                transform: scale(0.9) translateY(30px);
                filter: blur(10px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0);
            }
        }

        .prompt-container {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            animation: revealPrompt 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-primary {
            background: #6366f1;
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background: #4f46e5;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #a1a1aa;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .universal-skip {
            position: absolute;
            bottom: 20px;
            color: #5a5a66;
            font-size: 10px;
            text-decoration: underline;
            cursor: pointer;
            transition: 0.2s;
            opacity: 0.6;
        }

        .universal-skip:hover {
            color: #a1a1aa;
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="content">
        <img src="TeleCode-icon.png" class="logo" onerror="this.style.display='none'">
        <h1>TeleCode</h1>
        <p id="sub-header">Checking for updates...</p>

        <div class="progress-container" id="progress">
            <div class="progress-bar-bg">
                <div class="progress-bar"></div>
            </div>
            <div class="status-text" id="status">Connecting to GitHub...</div>
        </div>

        <div class="prompt-container" id="prompt">
            <div class="btn-group">
                <button class="btn btn-primary" style="padding: 10px 40px;" onclick="doUpdate()">Update Now</button>
            </div>
        </div>

        <div class="universal-skip" onclick="skipUpdate()">Skip Update & Launch</div>
        <div id="error"
            style="display: none; color: #e81123; font-size: 11px; margin-top: 15px; text-align: center; max-width: 300px;">
        </div>
        <button id="retry-btn" class="btn btn-primary" onclick="retry()"
            style="display: none; margin-top: 10px;">Retry</button>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        ipcRenderer.on('status', (e, msg) => {
            document.getElementById('status').innerText = msg;
        });

        ipcRenderer.on('update-prompt', () => {
            document.getElementById('progress').style.display = 'none';
            document.getElementById('sub-header').innerText = 'New update available!';
            document.getElementById('prompt').style.display = 'flex';
        });

        ipcRenderer.on('error', (e, msg) => {
            document.getElementById('progress').style.display = 'none';
            document.getElementById('prompt').style.display = 'none';
            document.getElementById('error').innerText = msg;
            document.getElementById('error').style.display = 'block';
            document.getElementById('retry-btn').style.display = 'inline-block';
        });

        function doUpdate() {
            document.getElementById('prompt').style.display = 'none';
            document.getElementById('progress').style.display = 'flex';
            document.getElementById('sub-header').innerText = 'Updating...';
            ipcRenderer.send('start-update');
        }

        function skipUpdate() {
            ipcRenderer.send('skip-update');
        }

        function retry() {
            document.getElementById('error').style.display = 'none';
            document.getElementById('retry-btn').style.display = 'none';
            document.getElementById('progress').style.display = 'flex';
            ipcRenderer.send('retry-update');
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>TeleCode Loader</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0e0e12;
            color: #e8e8ec;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at top, #1a1a24 0%, #0e0e12 60%);
        }

        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.4));
            animation: pulse 3s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.4));
            }

            50% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 30px rgba(99, 102, 241, 0.6));
            }
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        p {
            color: #5a5a66;
            font-size: 13px;
            margin-bottom: 40px;
        }

        .progress-container {
            width: 100%;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .progress-bar-bg {
            width: 100%;
            height: 4px;
            background: #1a1a24;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-bar {
            height: 100%;
            width: 30%;
            background: #6366f1;
            border-radius: 2px;
            animation: indeterminate 1.5s infinite ease-in-out;
        }

        @keyframes indeterminate {
            0% {
                transform: translateX(-100%);
                width: 30%;
            }

            50% {
                width: 50%;
            }

            100% {
                transform: translateX(300%);
                width: 30%;
            }
        }

        .status-text {
            color: #5a5a66;
            font-size: 11px;
            margin-top: 8px;
        }

        .error {
            color: #e81123;
            margin-top: 10px;
            font-size: 12px;
            display: none;
        }

        .retry-btn {
            background: #6366f1;
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 15px;
            cursor: pointer;
            display: none;
        }
    </style>
</head>

<body>
    <div class="content">
        <img src="TeleCode-icon.png" class="logo" onerror="this.style.display='none'">
        <h1>TeleCode</h1>
        <p>Checking for updates...</p>

        <div class="progress-container" id="progress">
            <div class="progress-bar-bg">
                <div class="progress-bar"></div>
            </div>
            <div class="status-text" id="status">Connecting to GitHub...</div>
        </div>

        <div class="error" id="error"></div>
        <button class="retry-btn" id="retry-btn" onclick="retry()">Retry</button>
        <button class="retry-btn" id="skip-btn" onclick="skip()">Skip Update</button>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        ipcRenderer.on('status', (e, msg) => {
            document.getElementById('status').innerText = msg;
        });

        ipcRenderer.on('error', (e, msg) => {
            document.getElementById('progress').style.display = 'none';
            document.getElementById('error').innerText = msg;
            document.getElementById('error').style.display = 'block';
            document.getElementById('retry-btn').style.display = 'inline-block';
            document.getElementById('skip-btn').style.display = 'inline-block';
        });

        function retry() {
            document.getElementById('error').style.display = 'none';
            document.getElementById('retry-btn').style.display = 'none';
            document.getElementById('skip-btn').style.display = 'none';
            document.getElementById('progress').style.display = 'flex';
            ipcRenderer.send('retry-update');
        }

        function skip() {
            ipcRenderer.send('skip-update');
        }
    </script>
</body>

</html>
